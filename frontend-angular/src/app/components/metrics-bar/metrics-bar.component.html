<div class="metrics-bar">
  <div class="metrics-bar__item">
    <span class="metrics-bar__value">{{ requests }}</span>
    <span class="metrics-bar__label">requests</span>
  </div>
  <div class="metrics-bar__item">
    <span class="metrics-bar__value">{{ unchanged }}</span>
    <span class="metrics-bar__label">sem mudança</span>
  </div>
  <div class="metrics-bar__item">
    <span class="metrics-bar__value">{{ wastePercent }}%</span>
    <span class="metrics-bar__label">desperdício</span>
  </div>
  <div class="metrics-bar__item">
    <span class="metrics-bar__value">{{ lastChangeDelayLabel }}</span>
    <span class="metrics-bar__label">atraso da última mudança</span>
  </div>
</div>
