<ul class="event-log">
  <li
    *ngFor="let row of rows; let last = last"
    [ngClass]="'event-log__row event-log__row--' + row.tone + (last ? ' event-log__row--enter' : '')"
  >
    <strong>{{ row.primary }}</strong>
    <span class="event-log__secondary" *ngIf="row.secondary"> — {{ row.secondary }}</span>
  </li>
</ul>
